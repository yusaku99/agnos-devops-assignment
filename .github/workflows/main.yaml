name: CI/CD Pipeline
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lint and Test
        run: echo "Running lint and tests..."

      - name: Build Container Images
        run: |
          docker build -t api-service ./api
          docker build -t worker-service ./worker